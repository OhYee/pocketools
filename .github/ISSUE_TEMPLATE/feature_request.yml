name: 功能建议
description: 提议符合 Pocketools 范围的新能力或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先确认提议符合项目的离线优先、隐私和内容边界。

        请不要在公开 issue 中发布令牌、密钥、真实个人信息、未修复漏洞或可用攻击载荷。安全问题请先阅读 `SECURITY.md`。

  - type: input
    id: version
    attributes:
      label: 当前版本或提交
      description: 请填写提议所依据的应用版本、构建号或 commit SHA；新项目请注明“未发布”。
      placeholder: "例如：v0.1.0+1 / abc1234 / 未发布"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      description: 请选择所有目标平台，并说明平台差异或限制。
      multiple: true
      options:
        - Android
        - Web/PWA
        - Android 与 Web/PWA
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 现状与复现/使用场景
      description: 请描述当前行为、可复现的限制或具体使用场景；若不适用，请填写“不适用”并说明原因。
      placeholder: |
        当前步骤或场景：
        1. ……
        2. ……
        当前限制：……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 请说明希望增加或改变什么，以及用户能获得的结果。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 请列出可验证的成功条件；如已知需求 ID，也请在这里注明。
      placeholder: |
        - [ ] ……
        - [ ] ……

  - type: textarea
    id: accessibility
    attributes:
      label: 无障碍与跨平台考虑
      description: 请说明键盘、读屏、触控、对比度、动态效果或 Android/Web 差异方面的考虑；不适用请说明。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与安全确认
      options:
        - label: 我已移除示例、截图和描述中的个人信息、凭证、令牌及其他敏感内容。
          required: true
        - label: 这不是需要私密报告的安全漏洞或隐私泄露；如果是，我会按照 SECURITY.md 报告。
          required: true
