name: 缺陷报告
description: 报告可复现的功能、兼容性或体验问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue，避免重复提交。

        请不要在公开 issue 中发布令牌、密钥、真实个人信息、未修复漏洞或可用攻击载荷。安全问题请先阅读 `SECURITY.md`。

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请填写应用版本、构建号或可复现问题的 commit SHA；未发布版本请注明。
      placeholder: "例如：v0.1.0+1 / abc1234 / 本地未发布"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 请选择所有受影响的平台，并在复现步骤中补充设备或浏览器信息。
      multiple: true
      options:
        - Android
        - Web/PWA
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的步骤、输入数据、设备型号、系统版本或浏览器版本。
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 清楚描述你认为应该发生什么。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 清楚描述实际发生了什么，以及问题出现的频率。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或录屏
      description: 可附上脱敏后的证据；请确认其中不含密钥、令牌、个人信息或敏感业务数据。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与安全确认
      options:
        - label: 我已移除日志、截图和复现数据中的个人信息、凭证、令牌及其他敏感内容。
          required: true
        - label: 这不是需要私密报告的安全漏洞或隐私泄露；如果是，我会按照 SECURITY.md 报告。
          required: true
