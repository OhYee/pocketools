name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.1 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Validate tag and signing configuration
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          package_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v${package_version}." >&2
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required release secret ${name} is not configured." >&2
              exit 1
            fi
          done

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          test -s "${ANDROID_KEYSTORE_PATH}"

      - name: Resolve locked dependencies
        run: make bootstrap

      - name: Run release verification gate
        run: make verify

      - name: Build signed split APKs
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: make build-android-release-split-per-abi

      - name: Verify APK signatures
        shell: bash
        run: |
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "${apksigner}"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "${apksigner}" verify --verbose "${apk}"
          done

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          tar -C build -czf "dist/wanxiangxia-web-${version}.tar.gz" web
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/wanxiangxia-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/wanxiangxia-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/wanxiangxia-${version}-x86_64.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "万象匣 ${GITHUB_REF_NAME}"

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f -- "${ANDROID_KEYSTORE_PATH}"
